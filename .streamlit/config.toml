# Streamlit settings for the FewShotLab demonstration (`python -m fewshotlab demo`).
# Offline and local: this machine only, no usage statistics, a 10 MB upload limit (the app
# itself also enforces 10 MB and 25 million pixels and checks the decoded content).

[server]
headless = true
address = "127.0.0.1"
maxUploadSize = 10
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#256abf"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
